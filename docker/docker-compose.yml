name: coupon-system

services:
  mysql:
    image: mysql:8.0
    container_name: coupon-mysql
    ports:
      - "13306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: coupon
      MYSQL_USER: coupon
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-coupon}
    command:
      - --default-time-zone=+00:00
    volumes:
      # named volume 필수: Windows bind mount는 I/O가 느려 측정을 왜곡한다
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-root}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7.4-alpine
    container_name: coupon-redis
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: coupon-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/rules.yml:/etc/prometheus/rules.yml:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # Kafka 비교 실험용 (record.mode=kafka): docker compose --profile kafka up -d kafka
  kafka:
    image: apache/kafka:3.8.1
    container_name: coupon-kafka
    profiles: ["kafka"]
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: coupon-alertmanager
    ports:
      - "9093:9093"
    volumes:
      - ./alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    depends_on:
      - mock-notify

  redis-exporter:
    image: oliver006/redis_exporter:v1.62.0
    container_name: coupon-redis-exporter
    environment:
      REDIS_ADDR: redis://redis:6379
    depends_on:
      - redis

  # HA 리허설용 LB: docker compose --profile lb up -d nginx
  # 단일 실행 모드(앱이 호스트 8080)와 포트가 겹치므로 필요할 때만 기동한다
  nginx:
    image: nginx:1.27-alpine
    container_name: coupon-nginx
    profiles: ["lb"]
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/html:/usr/share/nginx/html:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"

  grafana:
    image: grafana/grafana:11.6.0
    container_name: coupon-grafana
    ports:
      - "3000:3000"
    environment:
      # 로컬 전용: 익명 접근 허용
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: "Admin"
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus

  mock-notify:
    build: ./mock-notify
    container_name: coupon-mock-notify
    ports:
      - "8090:8090"
    environment:
      DEFAULT_DELAY_MS: "0"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8090/health"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  mysql-data:
