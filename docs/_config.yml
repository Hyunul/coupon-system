title: coupon-system 실험 노트
description: 선착순 쿠폰 발급 시스템 — 측정→병목 발견→개선→재측정을 수치로 기록한 성능 튜닝 블로그
lang: ko
theme: minima
# minima 기본값이 모든 페이지를 상단 내비게이션에 나열하는 것 방지 — 인덱스가 목차 역할
# (빈 배열은 Liquid default 필터가 무시하므로 index만 명시)
header_pages:
  - index.md
# GitHub Pages 기본 활성 플러그인(relative-links, optional-front-matter, default-layout,
# titles-from-headings)에 의존한다 — .md 상대 링크가 .html로 자동 변환된다
markdown: kramdown
# 첫 h1을 페이지 제목으로 쓰면서 본문에서는 제거 — 제목 이중 표시 방지
titles_from_headings:
  enabled: true
  strip_title: true
